<div id="principal">
    <p class="mensaje destacado">
        Hola, DAW
    </p>
</div>

p {
    color: blue;
}

.mensaje {
    color: green;
}

p.destacado {
    color: orange;
}

#principal p {
    color: red;
}

.mensaje.destacado {
    color: purple;
}

<!-- 
¿Qué color tendrá el texto?
el texto sera de color rojo porque gana la de mayor especifidad.

¿Qué selector tiene mayor especificidad?
el selector #principal p.

¿Qué ocurriría si eliminamos el selector #principal p?
ocurriria que el texto pasaria a ser morado porque la mas especifica es .mensaje.destacado.

¿Qué sucedería si añadimos otra regla .mensaje.destacado al final?
lo que ocurre es que competiria con .mensaje.destacado y acabaria ganando el nuevo.

¿Qué buenas prácticas aplicarías para evitar este tipo de conflictos?
no usaria ids para dar estilos, usar una metodologia de nombres como BEM y evitar duplicar reglas.


-->
