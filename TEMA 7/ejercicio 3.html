<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi tienda</title>
    <style>
        #encabezado {
            background: #333;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .oferta {
            background: gold;
            text-align: center;
            padding: 10px;
        }

        .tarjeta {
            display: inline-block;
            width: 200px;
            border: 1px solid gray;
            padding: 15px;
            margin: 10px;
            text-align: center;
        }

        .destacada {
            border: 3px solid green;
        }

        .boton {
            background: green;
            color: white;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header id="encabezado">
        <h1>Mi tienda</h1>
    </header>

    <p class="oferta">¡Oferta especial! 20% de descuento esta semana</p>

    <div class="tarjeta">
        <h2>Camiseta</h2>
        <p>15 €</p>
        <button class="boton">Comprar</button>
    </div>

    <div class="tarjeta destacada">
        <h2>Gorra</h2>
        <p>10 €</p>
        <button class="boton">Comprar</button>
    </div>

    <div class="tarjeta">
        <h2>Mochila</h2>
        <p>30 €</p>
        <button class="boton">Comprar</button>
    </div>

</body>
</html>
