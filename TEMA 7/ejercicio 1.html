<div id="contenedor">
    <h1 class="titulo">Mi página</h1>

    <p class="texto">Primer párrafo</p>

    <p class="texto destacado">Segundo párrafo</p>

    <section>
        <p class="texto">Tercer párrafo</p>
    </section>

    <button class="boton">Enviar</button>
</div>

<!-- 
1. Todos los párrafos.
p

2. El elemento con ID contenedor.
#contenedor

3. Los elementos con clase destacado.
.destacado

4. Los párrafos que tengan la clase texto.
p.texto

5. Los párrafos descendientes de section.
section p

6. El botón.
boton

7. El primer hijo de section.
section :first-child

8. El párrafo que tenga simultáneamente las clases texto y destacado.
p.texto.destacado

-->
